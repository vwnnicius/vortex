<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="60%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Tactical lines -->
  <line x1="120" y1="180" x2="1080" y2="180" stroke="#262626" stroke-width="1"/>
  <line x1="120" y1="460" x2="1080" y2="460" stroke="#262626" stroke-width="1"/>

  <!-- Logo Mark -->
  <g transform="translate(550, 200)">
    <path d="M0 0 L40 90 L60 90 L20 0 Z" fill="#FFFFFF"/>
    <path d="M100 0 L55 90 L40 90 L80 0 Z" fill="#94A3B8"/>
  </g>

  <!-- Titles -->
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="12" fill="url(#textGrad)">VORTEX</text>
  <text x="600" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="500" letter-spacing="4" fill="#A0A0A0">STREAMER • VIDEO EDITOR • MOTION DESIGNER • DESIGNER</text>
  <text x="600" y="520" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="3" fill="#525252">[ DIGITAL IDENTITY // OFFICIAL HUB ]</text>
</svg>
