<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Dark Rounded Hexagon / Shield -->
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#222222" stroke-width="1.5"/>
  
  <!-- Sleek Sharp "V" Monogram with steel gradient -->
  <defs>
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
  </defs>

  <!-- Left Blade of the V -->
  <path d="M14 16 L28 48 L35 48 L22 16 Z" fill="url(#vortexGrad)"/>
  
  <!-- Right Blade of the V (Sharp offset cross-cut) -->
  <path d="M50 16 L33 48 L27 48 L42 16 Z" fill="#E2E8F0" opacity="0.9"/>

  <!-- Subtle Tactical Crosshair Center Mark -->
  <circle cx="32" cy="24" r="1.5" fill="#FFFFFF"/>
</svg>
