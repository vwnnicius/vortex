<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Dark Rounded Hexagon / Shield -->
  <rect width="64" height="64" rx="14" fill="#07070A"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#2D224D" stroke-width="1.5"/>
  
  <defs>
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="omenPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Left Blade of the V -->
  <path d="M14 16 L28 48 L35 48 L22 16 Z" fill="url(#vortexGrad)"/>
  
  <!-- Right Blade of the V (Omen Purple Accent) -->
  <path d="M50 16 L33 48 L27 48 L42 16 Z" fill="url(#omenPurple)"/>

  <!-- Omen Eye Hint -->
  <circle cx="28" cy="23" r="1.3" fill="#C4B5FD"/>
  <circle cx="32" cy="20" r="1.5" fill="#FFFFFF"/>
  <circle cx="36" cy="23" r="1.3" fill="#C4B5FD"/>
</svg>
